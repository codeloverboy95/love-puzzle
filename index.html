<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ভালোবাসার ছোঁয়া - Seductive Secrets</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #2e021a 0%, #0d0007 100%);
            color: #ffe4e6;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            touch-action: none;
        }

        .glow-title {
            text-shadow: 0 0 12px rgba(244, 63, 94, 0.9), 0 0 24px rgba(225, 29, 72, 0.7);
        }

        .glass-frame {
            background: rgba(255, 20, 147, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(244, 63, 94, 0.35);
            box-shadow: 0 0 35px rgba(225, 29, 72, 0.3);
        }

        /* Maximized puzzle grid container */
        .puzzle-container {
            width: min(calc(100vw - 24px), calc(100dvh - 165px));
            height: min(calc(100vw - 24px), calc(100dvh - 165px));
            max-width: 620px;
            max-height: 620px;
        }

        /* Highlighting Selected Tile */
        .tile-selected {
            z-index: 30 !important;
            transform: scale(1.04) !important;
            box-shadow: 0 0 22px rgba(244, 63, 94, 1), 0 0 35px rgba(255, 20, 147, 0.8) !important;
            border: 2.5px solid #ff4d6d !important;
            animation: tilePulse 1.2s infinite ease-in-out;
        }

        @keyframes tilePulse {
            0%, 100% { border-color: #ff4d6d; box-shadow: 0 0 18px rgba(244, 63, 94, 0.9); }
            50% { border-color: #ff85a1; box-shadow: 0 0 30px rgba(255, 20, 147, 1); }
        }

        /* Grayscale Filter for Unmatched Tiles */
        .tile-grayscale {
            filter: grayscale(100%) contrast(105%) brightness(85%);
            transition: filter 0.4s ease-in-out, transform 0.15s ease;
        }

        /* Vibrant Color Filter for Correct Position Tiles */
        .tile-color {
            filter: grayscale(0%) contrast(100%) brightness(100%);
            transition: filter 0.4s ease-in-out, transform 0.15s ease;
            box-shadow: inset 0 0 12px rgba(244, 63, 94, 0.3);
        }

        .heart-btn {
            background: linear-gradient(135deg, #e11d48 0%, #9f1239 100%);
            box-shadow: 0 4px 18px rgba(225, 29, 72, 0.5);
        }

        .scale-up {
            transform: scale(1);
            opacity: 1;
            pointer-events: auto;
        }
        .scale-down {
            transform: scale(0);
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-2 relative select-none w-full h-full">

    <!-- Ambient Floating Background Canvas -->
    <canvas id="bgParticleCanvas" class="fixed inset-0 w-full h-full pointer-events-none z-0"></canvas>

    <!-- Header Section -->
    <header class="w-full max-w-md text-center pt-1 z-10 flex-shrink-0 px-2">
        <h1 class="text-xl sm:text-3xl font-extrabold tracking-wide text-rose-300 glow-title flex items-center justify-center gap-2">
            <span>💖</span> ভালোবাসার ছোঁয়া <span>💖</span>
        </h1>
        <p class="text-xs sm:text-sm text-rose-200/90 italic mt-1 font-semibold px-2 leading-snug min-h-[32px] flex items-center justify-center text-center transition-all duration-300" id="quote-text">
            "সঠিক জায়গায় মেলালেই ছোঁয়া পাবে রঙের... 💖"
        </p>
    </header>

    <!-- Main Game Area -->
    <main class="w-full flex-1 flex items-center justify-center relative my-auto z-10">
        <div class="puzzle-container relative glass-frame rounded-2xl p-1.5 flex items-center justify-center shadow-2xl">
            
            <!-- 3x3 Puzzle Grid -->
            <div id="puzzleGrid" class="w-full h-full grid grid-cols-3 gap-[2px] rounded-xl overflow-hidden bg-rose-950/60 p-[1px] relative">
                <!-- Tiles injected dynamically -->
            </div>

            <!-- Particle Effect Layer over the Puzzle -->
            <canvas id="fxCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-30"></canvas>

            <!-- Victory Next Button Overlay (Unobtrusive) -->
            <div id="win-modal" class="scale-down absolute bottom-4 left-1/2 -translate-x-1/2 z-40 transition-all duration-300">
                <button onclick="nextLevel()" class="heart-btn px-6 py-3 text-white font-extrabold rounded-full shadow-2xl hover:scale-105 active:scale-95 transition-all text-xs sm:text-sm border border-rose-300/60 glow-title flex items-center gap-2 whitespace-nowrap">
                    <span>পরের ছবি 💖</span>
                </button>
            </div>

        </div>
    </main>

    <!-- Ultra-Clean Single-Row Controls -->
    <footer class="w-full max-w-md pb-2 px-2 z-10 flex-shrink-0">
        <div class="flex items-center justify-center gap-2 w-full">
            <!-- Level Switchers -->
            <button onclick="selectLevel(0)" class="level-btn flex-1 py-2 font-bold rounded-xl bg-rose-950/80 border border-rose-500/40 text-rose-200 active:scale-95 hover:bg-rose-900 transition text-xs sm:text-sm text-center">১</button>
            <button onclick="selectLevel(1)" class="level-btn flex-1 py-2 font-bold rounded-xl bg-rose-950/80 border border-rose-500/40 text-rose-200 active:scale-95 hover:bg-rose-900 transition text-xs sm:text-sm text-center">২</button>
            <button onclick="selectLevel(2)" class="level-btn flex-1 py-2 font-bold rounded-xl bg-rose-950/80 border border-rose-500/40 text-rose-200 active:scale-95 hover:bg-rose-900 transition text-xs sm:text-sm text-center">৩</button>

            <!-- Audio Mute/Unmute -->
            <button id="soundBtn" onclick="toggleSound()" title="Audio Toggle" class="p-2 bg-rose-950/80 border border-rose-500/40 rounded-xl hover:bg-rose-900 active:scale-95 transition text-rose-200 flex items-center justify-center">
                <svg id="soundIcon" class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
            </button>

            <!-- Peek Original Image Hint -->
            <button onclick="previewOriginal()" title="Peek Original" class="p-2 bg-rose-950/80 border border-rose-500/40 rounded-xl hover:bg-rose-900 active:scale-95 transition text-rose-200 flex items-center justify-center">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
            </button>
        </div>
    </footer>

    <!-- Interactive Script -->
    <script>
        const gridEl = document.getElementById('puzzleGrid');
        const fxCanvas = document.getElementById('fxCanvas');
        const fxCtx = fxCanvas.getContext('2d');
        const winModal = document.getElementById('win-modal');
        const quoteEl = document.getElementById('quote-text');
        const bgParticleCanvas = document.getElementById('bgParticleCanvas');
        const bgCtx = bgParticleCanvas.getContext('2d');

        const gridSize = 3;
        const totalTiles = gridSize * gridSize;
        let tileState = [];
        let selectedTileIndex = null;
        let isWon = false;
        let currentLevelIndex = 0;
        let bgParticles = [];
        let loveParticles = [];
        let soundMuted = false;

        const levels = [
            {
                src: 'images/puzzle1.jpg',
                title: 'পাপড়ি ১ - মিষ্টি শুরু',
                quote: '"সঠিক টুকরো মেলালেই পাবে মিষ্টি রঙ... 💖"',
                winMsg: '"উফ! সব রঙেই তুমি আমায় রাঙিয়ে দিলে... ❤️"'
            },
            {
                src: 'images/puzzle2.jpg',
                title: 'পাপড়ি ২ - গভীর অনুরাগ',
                quote: '"তোমার পরশে সাদা-কালো রূপ নিক রঙিন স্বপ্নে... 💕"',
                winMsg: '"একদম পারফেক্ট! রঙিন অনুরাগে ভরিয়ে দাও... 🔥"'
            },
            {
                src: 'images/puzzle3.jpg',
                title: 'পাপড়ি ৩ - ভালোবাসার চরম মুহূর্ত',
                quote: '"আর একটুখানি... সবকটি টুকরো রঙিন করে তোলো! 🌹"',
                winMsg: '"রঙের খেলায় তুমি জয়ী! এবার শুধুই আমাদের সময়... ✨"'
            }
        ];

        let loadedImageCanvas = null;

        // Audio Synthesizer
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, duration, type = 'sine') {
            if (soundMuted || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function toggleSound() {
            soundMuted = !soundMuted;
            const soundIcon = document.getElementById('soundIcon');
            if (soundMuted) {
                soundIcon.innerHTML = `<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>`;
            } else {
                soundIcon.innerHTML = `<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>`;
            }
        }

        function loadLevel(index) {
            currentLevelIndex = index;
            isWon = false;
            selectedTileIndex = null;
            winModal.classList.remove('scale-up');
            winModal.classList.add('scale-down');
            quoteEl.innerText = levels[currentLevelIndex].quote;

            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = levels[currentLevelIndex].src;

            img.onload = () => {
                prepareImageCanvas(img);
                initAndShuffle();
            };

            // Procedural Canvas Fallback Graphic
            img.onerror = () => {
                const fallbackCanvas = document.createElement('canvas');
                fallbackCanvas.width = 900;
                fallbackCanvas.height = 900;
                const fCtx = fallbackCanvas.getContext('2d');

                const grad = fCtx.createRadialGradient(450, 450, 60, 450, 450, 520);
                grad.addColorStop(0, '#be123c');
                grad.addColorStop(0.6, '#881337');
                grad.addColorStop(1, '#3b071e');
                fCtx.fillStyle = grad;
                fCtx.fillRect(0, 0, 900, 900);

                fCtx.strokeStyle = 'rgba(254, 205, 211, 0.35)';
                fCtx.lineWidth = 12;
                fCtx.strokeRect(30, 30, 840, 840);

                drawHeartShape(fCtx, 450, 260, 280, 'rgba(255, 255, 255, 0.08)', 1);

                fCtx.fillStyle = '#fecdd3';
                fCtx.font = 'bold 44px sans-serif';
                fCtx.textAlign = 'center';
                fCtx.fillText(`✨ ${levels[currentLevelIndex].title} ✨`, 450, 320);

                drawHeartShape(fCtx, 450, 410, 110, '#f43f5e', 1);

                fCtx.fillStyle = '#ffffff';
                fCtx.font = 'bold 36px sans-serif';
                wrapText(fCtx, levels[currentLevelIndex].winMsg, 450, 600, 720, 50);

                const fallbackImg = new Image();
                fallbackImg.src = fallbackCanvas.toDataURL();
                fallbackImg.onload = () => {
                    prepareImageCanvas(fallbackImg);
                    initAndShuffle();
                };
            };
        }

        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let currentY = y;

            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    ctx.fillText(line, x, currentY);
                    line = words[n] + ' ';
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, currentY);
        }

        function prepareImageCanvas(image) {
            const canvas = document.createElement('canvas');
            canvas.width = 900;
            canvas.height = 900;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(image, 0, 0, 900, 900);
            loadedImageCanvas = canvas;
        }

        // STRICT Shuffle: Ensures NO tile is at its original position initially
        function initAndShuffle() {
            tileState = Array.from({ length: totalTiles }, (_, i) => i);

            let completelyShuffled = false;
            while (!completelyShuffled) {
                for (let i = tileState.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [tileState[i], tileState[j]] = [tileState[j], tileState[i]];
                }

                const anyOriginalPlaced = tileState.some((val, idx) => val === idx);
                if (!anyOriginalPlaced) {
                    completelyShuffled = true;
                }
            }

            resizeFxCanvas();
            renderGrid();
        }

        function resizeFxCanvas() {
            const rect = gridEl.getBoundingClientRect();
            fxCanvas.width = rect.width;
            fxCanvas.height = rect.height;
        }

        function renderGrid() {
            gridEl.innerHTML = '';
            const pieceSize = 300; // 900 / 3

            tileState.forEach((originalIndex, currentPos) => {
                const tileDiv = document.createElement('div');
                const isCorrect = (originalIndex === currentPos);

                tileDiv.dataset.pos = currentPos;
                tileDiv.className = `relative w-full h-full rounded-md sm:rounded-lg overflow-hidden cursor-pointer transition-all duration-300 ${
                    isCorrect ? 'tile-color border border-rose-400/40' : 'tile-grayscale border border-white/10'
                } ${selectedTileIndex === currentPos ? 'tile-selected' : ''}`;

                const origRow = Math.floor(originalIndex / gridSize);
                const origCol = originalIndex % gridSize;

                const tileCanvas = document.createElement('canvas');
                tileCanvas.width = pieceSize;
                tileCanvas.height = pieceSize;
                tileCanvas.className = "w-full h-full object-cover pointer-events-none";

                const ctx = tileCanvas.getContext('2d');
                if (loadedImageCanvas) {
                    ctx.drawImage(
                        loadedImageCanvas,
                        origCol * pieceSize, origRow * pieceSize, pieceSize, pieceSize,
                        0, 0, pieceSize, pieceSize
                    );
                }

                tileDiv.appendChild(tileCanvas);
                tileDiv.onclick = () => onTileClick(currentPos);
                gridEl.appendChild(tileDiv);
            });
        }

        function onTileClick(clickedPos) {
            if (isWon) return;

            if (selectedTileIndex === null) {
                selectedTileIndex = clickedPos;
                playSound(440, 0.08);
                renderGrid();
            } else if (selectedTileIndex === clickedPos) {
                selectedTileIndex = null;
                playSound(330, 0.08);
                renderGrid();
            } else {
                const pos1 = selectedTileIndex;
                const pos2 = clickedPos;

                // Instant Swap without delay
                [tileState[pos1], tileState[pos2]] = [tileState[pos2], tileState[pos1]];
                selectedTileIndex = null;

                playSound(587.33, 0.1, 'triangle');
                renderGrid();

                // Trigger Particle FX if any tile landed on its original spot
                if (tileState[pos1] === pos1) triggerLoveParticles(pos1);
                if (tileState[pos2] === pos2) triggerLoveParticles(pos2);

                checkWin();
            }
        }

        // Trigger Love Heart Burst FX at specific tile index
        function triggerLoveParticles(tileIndex) {
            playSound(880, 0.15, 'sine');

            const col = tileIndex % gridSize;
            const row = Math.floor(tileIndex / gridSize);
            const cellW = fxCanvas.width / gridSize;
            const cellH = fxCanvas.height / gridSize;

            const centerX = col * cellW + cellW / 2;
            const centerY = row * cellH + cellH / 2;

            for (let i = 0; i < 16; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 2;
                loveParticles.push({
                    x: centerX,
                    y: centerY,
                    size: Math.random() * 12 + 8,
                    speedX: Math.cos(angle) * speed,
                    speedY: Math.sin(angle) * speed - 1,
                    opacity: 1,
                    color: Math.random() > 0.3 ? '#f43f5e' : '#ff85a1'
                });
            }
        }

        function animateLoveParticles() {
            fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

            for (let i = loveParticles.length - 1; i >= 0; i--) {
                const p = loveParticles[i];
                p.x += p.speedX;
                p.y += p.speedY;
                p.opacity -= 0.025;

                if (p.opacity <= 0) {
                    loveParticles.splice(i, 1);
                    continue;
                }

                drawHeartShape(fxCtx, p.x, p.y, p.size, p.color, p.opacity);
            }

            requestAnimationFrame(animateLoveParticles);
        }

        function checkWin() {
            const isCorrect = tileState.every((val, index) => val === index);
            if (isCorrect) {
                isWon = true;
                quoteEl.innerText = levels[currentLevelIndex].winMsg;
                
                playSound(523.25, 0.15);
                setTimeout(() => playSound(659.25, 0.15), 150);
                setTimeout(() => playSound(783.99, 0.25), 300);

                setTimeout(() => {
                    winModal.classList.remove('scale-down');
                    winModal.classList.add('scale-up');
                }, 300);
            }
        }

        function previewOriginal() {
            if (isWon) return;
            playSound(392, 0.1);
            const tempState = [...tileState];
            tileState = Array.from({ length: totalTiles }, (_, i) => i);
            renderGrid();

            setTimeout(() => {
                tileState = tempState;
                renderGrid();
            }, 1200);
        }

        function selectLevel(index) {
            playSound(493.88, 0.1);
            loadLevel(index);
        }

        function nextLevel() {
            const nextIdx = (currentLevelIndex + 1) % levels.length;
            selectLevel(nextIdx);
        }

        /* Ambient Floating Heart Background Animation */
        function initBgParticles() {
            bgParticleCanvas.width = window.innerWidth;
            bgParticleCanvas.height = window.innerHeight;
            bgParticles = [];
            const count = Math.min(Math.floor(window.innerWidth / 18), 35);

            for (let i = 0; i < count; i++) {
                bgParticles.push({
                    x: Math.random() * bgParticleCanvas.width,
                    y: Math.random() * bgParticleCanvas.height,
                    size: Math.random() * 8 + 4,
                    speedY: Math.random() * 0.6 + 0.2,
                    speedX: (Math.random() - 0.5) * 0.4,
                    opacity: Math.random() * 0.5 + 0.2,
                    color: Math.random() > 0.5 ? '#f43f5e' : '#fda4af'
                });
            }
        }

        function drawHeartShape(ctx, x, y, size, color, opacity) {
            ctx.save();
            ctx.globalAlpha = opacity;
            ctx.fillStyle = color;
            ctx.beginPath();
            const topCurveHeight = size * 0.3;
            ctx.moveTo(x, y + topCurveHeight);
            ctx.bezierCurveTo(x, y, x - size / 2, y, x - size / 2, y + topCurveHeight);
            ctx.bezierCurveTo(x - size / 2, y + (size + topCurveHeight) / 2, x, y + size, x, y + size);
            ctx.bezierCurveTo(x, y + size, x + size / 2, y + (size + topCurveHeight) / 2, x + size / 2, y + topCurveHeight);
            ctx.bezierCurveTo(x + size / 2, y, x, y, x, y + topCurveHeight);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function animateBgParticles() {
            bgCtx.clearRect(0, 0, bgParticleCanvas.width, bgParticleCanvas.height);
            bgParticles.forEach(p => {
                p.y -= p.speedY;
                p.x += p.speedX;
                if (p.y < -20) {
                    p.y = bgParticleCanvas.height + 20;
                    p.x = Math.random() * bgParticleCanvas.width;
                }
                drawHeartShape(bgCtx, p.x, p.y, p.size, p.color, p.opacity);
            });
            requestAnimationFrame(animateBgParticles);
        }

        window.addEventListener('resize', () => {
            bgParticleCanvas.width = window.innerWidth;
            bgParticleCanvas.height = window.innerHeight;
            resizeFxCanvas();
        });

        window.onload = () => {
            initBgParticles();
            requestAnimationFrame(animateBgParticles);
            requestAnimationFrame(animateLoveParticles);
            loadLevel(0);
        };
    </script>
</body>
</html>
